    background: var(--bg);
    color: var(--text);

    left: 0; right: 0; bottom: 0;

<script>
  function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

  function setError(msg) {
    document.getElementById('error-msg').textContent = msg;
  }

  function updateOutputs(r8, g8, b8) {
    const r10 = Math.round((r8 / 255) * 1023);
    const g10 = Math.round((g8 / 255) * 1023);
    const b10 = Math.round((b8 / 255) * 1023);
    const hexOut = '#' + [r8, g8, b8].map(v => v.toString(16).padStart(2, '0')).join('');

    // Update swatch
    const swatch = document.getElementById('color-swatch');
    swatch.style.background = hexOut;
    swatch.dataset.hex = hexOut.toUpperCase();

    // Update output cards
    document.getElementById('out-hex').textContent   = hexOut.toUpperCase();
    document.getElementById('out-8bit').textContent  = r8 + '\n' + g8 + '\n' + b8;
    document.getElementById('out-10bit').textContent = r10 + '\n' + g10 + '\n' + b10;

    return { r8, g8, b8, r10, g10, b10, hexOut };
  }

  function liveConvert(source) {
    setError('');

    if (source === 'hex') {
      const raw = document.getElementById('hex').value.trim();
      if (!raw) return;
      const clean = raw.startsWith('#') ? raw : '#' + raw;
      if (!/^#([0-9A-Fa-f]{6})$/.test(clean)) { setError('Invalid hex value'); return; }
      const r8 = parseInt(clean.substr(1,2),16);
      const g8 = parseInt(clean.substr(3,2),16);
      const b8 = parseInt(clean.substr(5,2),16);
      const out = updateOutputs(r8, g8, b8);
      document.getElementById('r8').value  = out.r8;
      document.getElementById('g8').value  = out.g8;
      document.getElementById('b8').value  = out.b8;
      document.getElementById('r10').value = out.r10;
      document.getElementById('g10').value = out.g10;
      document.getElementById('b10').value = out.b10;
    }

    else if (source === '8bit') {
      const ri = document.getElementById('r8').value;
      const gi = document.getElementById('g8').value;
      const bi = document.getElementById('b8').value;
      if (ri === '' || gi === '' || bi === '') return;
      const r8 = clamp(parseInt(ri), 0, 255);
      const g8 = clamp(parseInt(gi), 0, 255);
      const b8 = clamp(parseInt(bi), 0, 255);
      const out = updateOutputs(r8, g8, b8);
      document.getElementById('hex').value  = out.hexOut.toUpperCase();
      document.getElementById('r10').value  = out.r10;
      document.getElementById('g10').value  = out.g10;
      document.getElementById('b10').value  = out.b10;
    }

    else if (source === '10bit') {
      const ri = document.getElementById('r10').value;
      const gi = document.getElementById('g10').value;
      const bi = document.getElementById('b10').value;
      if (ri === '' || gi === '' || bi === '') return;
      const r10 = clamp(parseInt(ri), 0, 1023);
      const g10 = clamp(parseInt(gi), 0, 1023);
      const b10 = clamp(parseInt(bi), 0, 1023);
      const r8  = Math.round((r10 / 1023) * 255);
      const g8  = Math.round((g10 / 1023) * 255);
      const b8  = Math.round((b10 / 1023) * 255);
      const out = updateOutputs(r8, g8, b8);
      document.getElementById('hex').value = out.hexOut.toUpperCase();
      document.getElementById('r8').value  = out.r8;
      document.getElementById('g8').value  = out.g8;
      document.getElementById('b8').value  = out.b8;
    }
  }

  function clearAll() {
    ['hex','r8','g8','b8','r10','g10','b10'].forEach(id => {
      document.getElementById(id).value = '';
    });
    const swatch = document.getElementById('color-swatch');
    swatch.style.background = '#1a1a1a';
    swatch.dataset.hex = '—';
    document.getElementById('out-hex').textContent   = '—';
    document.getElementById('out-8bit').textContent  = '—';
    document.getElementById('out-10bit').textContent = '—';
    setError('');
  }
</script>
</body>
</html>" sandbox="allow-scripts allow-same-origin"></iframe>

</style>
</head>
<body>

<div id=&quot;topbar&quot;>
  <span class=&quot;topbar-title&quot;>Test Pattern</span>
  <div class=&quot;topbar-sep&quot;></div>
  <button class=&quot;btn-icon&quot; id=&quot;fs-btn&quot; title=&quot;Fullscreen (F)&quot;>⛶</button>
</div>

<div id=&quot;main&quot;>
  <div id=&quot;canvas-wrap&quot;>
    <canvas id=&quot;canvas&quot;></canvas>
  </div>

  <div id=&quot;side&quot;>

    <!-- GRID -->
    <div class=&quot;panel-section&quot;>
      <div class=&quot;panel-label&quot;>Grid</div>
      <div class=&quot;ctrl-label&quot; style=&quot;font-size:11px;margin-bottom:4px;color:#777&quot;>Grid Size (px)</div>
      <input type=&quot;number&quot; id=&quot;grid-size&quot; value=&quot;80&quot; min=&quot;20&quot; max=&quot;400&quot;>

    <!-- OVERLAYS -->

      <div class=&quot;panel-label&quot;>Overlays</div>

      </div>
      <div class=&quot;ctrl-row&quot; style=&quot;margin-bottom:0&quot;>
        <span class=&quot;ctrl-label&quot;>Centre Cross</span>

      </div>

    <!-- COLOURS -->

        <div class=&quot;color-item&quot;><label>Grid</label><input type=&quot;color&quot; id=&quot;col-grid&quot; value=&quot;#333333&quot;></div>
        <div class=&quot;color-item&quot;><label>Circles</label><input type=&quot;color&quot; id=&quot;col-circle&quot; value=&quot;#ffffff&quot;></div>

    <!-- BORDER -->

      <input type=&quot;number&quot; id=&quot;border-w&quot; value=&quot;2&quot; min=&quot;1&quot; max=&quot;100&quot;>
      <div class=&quot;color-row&quot; style=&quot;margin-top:8px&quot;>
        <div class=&quot;color-item&quot;><label>Colour</label><input type=&quot;color&quot; id=&quot;col-border&quot; value=&quot;#ff3333&quot;></div>
      </div>

    <!-- EXPORT -->
    <div class=&quot;panel-section&quot;>
      <div class=&quot;panel-label&quot;>Export</div>
      <div class=&quot;preset-grid&quot;>
        <button class=&quot;btn preset-btn&quot; data-w=&quot;1920&quot; data-h=&quot;1080&quot;>1920×1080</button>
        <button class=&quot;btn preset-btn&quot; data-w=&quot;3840&quot; data-h=&quot;2160&quot;>3840×2160</button>
        <button class=&quot;btn preset-btn&quot; data-w=&quot;2560&quot; data-h=&quot;1440&quot;>2560×1440</button>
        <button class=&quot;btn preset-btn&quot; data-w=&quot;1280&quot; data-h=&quot;720&quot;>1280×720</button>
        <button class=&quot;btn preset-btn&quot; data-w=&quot;4096&quot; data-h=&quot;2160&quot;>4096×2160</button>
        <button class=&quot;btn preset-btn&quot; data-w=&quot;1024&quot; data-h=&quot;768&quot;>1024×768</button>
      </div>
      <div style=&quot;display:flex;align-items:center;gap:6px;margin-bottom:6px;margin-top:4px&quot;>
        <input type=&quot;number&quot; id=&quot;export-w&quot; value=&quot;1920&quot; min=&quot;1&quot; max=&quot;16000&quot; style=&quot;margin-top:0;text-align:center&quot;>
        <span style=&quot;color:#555;font-size:12px;flex-shrink:0&quot;>×</span>
        <input type=&quot;number&quot; id=&quot;export-h&quot; value=&quot;1080&quot; min=&quot;1&quot; max=&quot;16000&quot; style=&quot;margin-top:0;text-align:center&quot;>
      </div>
      <button class=&quot;btn btn-accent&quot; id=&quot;export-btn&quot;>Export PNG</button>
    </div>

    <div class=&quot;spacer&quot;></div>

  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');

  // ── State ──
  const state = {
    gridSize:  80,
    corners:   true,
    cross:     true,
    bg:        '#000000',
    gridCol:   '#333333',
    circleCol: '#ffffff',
    crossCol:  '#ff3333',
  };

  // ── Draw ──
  function draw() {
    const W = canvas.width;
    const H = canvas.height;
    const gs = Math.max(10, state.gridSize);
    const cx = W / 2, cy = H / 2;

    ctx.fillStyle = state.bg;
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = state.gridCol;
    ctx.lineWidth = 0.75;
    for (let x = cx % gs; x <= W; x += gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let x = cx % gs - gs; x >= 0; x -= gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = cy % gs; y <= H; y += gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    for (let y = cy % gs - gs; y >= 0; y -= gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // Grid labels
    const labelFs = Math.max(9, Math.min(gs * 0.28, 16));
    ctx.font = `500 ${labelFs}px 'JetBrains Mono', monospace`;
    ctx.fillStyle = state.gridCol;
    ctx.globalAlpha = 0.7;
    const rowTop    = ['E','D','C','B','A'];
    const rowBottom = ['a','b','c','d','e'];
    let ci = 1;
    for (let x = cx + gs; x < W; x += gs, ci++) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';    ctx.fillText(ci,  x, 4);
      ctx.textBaseline = 'bottom'; ctx.fillText(ci,  x, H-4);
    }
    ci = 1;
    for (let x = cx - gs; x > 0; x -= gs, ci++) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';    ctx.fillText(-ci, x, 4);
      ctx.textBaseline = 'bottom'; ctx.fillText(-ci, x, H-4);
    }
    let ri = 0;
    for (let y = cy - gs; y > 0; y -= gs, ri++) {
      const l = rowTop[Math.min(ri, rowTop.length-1)];
      ctx.textAlign='left';  ctx.textBaseline='middle'; ctx.fillText(l, 4,   y);
      ctx.textAlign='right';                            ctx.fillText(l, W-4, y);
    }
    ri = 0;
    for (let y = cy + gs; y < H; y += gs, ri++) {
      const l = rowBottom[Math.min(ri, rowBottom.length-1)];
      ctx.textAlign='left';  ctx.textBaseline='middle'; ctx.fillText(l, 4,   y);
      ctx.textAlign='right';                            ctx.fillText(l, W-4, y);
    }
    ctx.globalAlpha = 1;

    // Diagonal corner lines
    ctx.strokeStyle = state.gridCol;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.55;
    [[0,0],[W,0],[0,H],[W,H]].forEach(([px,py]) => {
      ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(cx,cy); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Circles
    const r = H / 2;
    ctx.strokeStyle = state.circleCol;
    ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.9;
    [cx, 0, W].forEach(x => {
      ctx.beginPath(); ctx.arc(x, cy, r, 0, Math.PI*2); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    // Centre cross
    if (state.cross) {
      ctx.strokeStyle = state.crossCol;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(W, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
      ctx.stroke();
      ctx.fillStyle = state.crossCol;
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = state.crossCol; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI*2); ctx.stroke();
    }

    // Corner markers
    if (state.corners) {
      const mk = Math.min(gs * 0.8, 40);
      ctx.strokeStyle = state.crossCol;
      ctx.lineWidth = 1.5;
      [[0,0],[W,0],[0,H],[W,H]].forEach(([px,py]) => {
        const dx = px===0?1:-1, dy = py===0?1:-1;
        ctx.beginPath();
        ctx.moveTo(px,py); ctx.lineTo(px+dx*mk, py);
        ctx.moveTo(px,py); ctx.lineTo(px, py+dy*mk);
        ctx.stroke();
      });
      const tick = Math.min(gs*0.5, 24);
      [[cx,0,0,tick],[cx,H,0,-tick],[0,cy,tick,0],[W,cy,-tick,0]].forEach(([x,y,dx,dy]) => {
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+dx,y+dy); ctx.stroke();
      });
    }

    // Resolution watermark
    const fs = Math.max(12, Math.min(W,H)*0.028);
    ctx.font = `600 ${fs}px 'JetBrains Mono', monospace`;
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.6;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`${W}px × ${H}px`, cx, cy - H*0.13);
    ctx.globalAlpha = 1;

    // Border
    if (state.showBorder) {
      const bw = Math.max(1, state.borderW);
      ctx.strokeStyle = state.borderCol;
      ctx.lineWidth = bw;
      ctx.strokeRect(bw/2, bw/2, W - bw, H - bw);
    }
  }

  // ── Resize ──
  function resize() {
    const wrap = document.getElementById('canvas-wrap');
    canvas.width  = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    draw();
  }

  window.addEventListener('resize', resize);
  resize();

  // ── Controls ──
  function bind(id, key, type) {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      state[key] = type === 'bool' ? el.checked : type === 'num' ? (parseInt(el.value)||80) : el.value;
      draw();
    });
  }

  bind('grid-size',   'gridSize',   'num');
  bind('show-corners','corners',    'bool');
  bind('show-cross',  'cross',      'bool');
  bind('col-bg',      'bg',         'str');
  bind('col-grid',    'gridCol',    'str');
  bind('col-circle',  'circleCol',  'str');
  bind('col-cross',   'crossCol',   'str');
  bind('show-border', 'showBorder', 'bool');
  bind('border-w',    'borderW',    'num');
  bind('col-border',  'borderCol',  'str');

  // Preset buttons
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('export-w').value = btn.dataset.w;
      document.getElementById('export-h').value = btn.dataset.h;
    });
  });

  // Export
  document.getElementById('export-btn').addEventListener('click', () => {
    const W = parseInt(document.getElementById('export-w').value) || 1920;
    const H = parseInt(document.getElementById('export-h').value) || 1080;
    const offscreen = document.createElement('canvas');
    offscreen.width  = W;
    offscreen.height = H;
    const octx = offscreen.getContext('2d');
    // Temporarily swap ctx to offscreen
    const realCtx = ctx;
    Object.defineProperty(window, 'ctx', { value: octx, configurable: true });
    // Save canvas size, draw at export size
    const savedW = canvas.width, savedH = canvas.height;
    canvas.width = W; canvas.height = H;
    // Draw on offscreen
    const tmpCanvas = canvas;
    offscreen.getContext('2d');
    // Use a self-contained export draw
    exportDraw(octx, W, H);
    // Restore
    canvas.width = savedW; canvas.height = savedH;
    draw();
    // Download
    const a = document.createElement('a');
    a.download = `test-pattern-${W}x${H}.png`;
    a.href = offscreen.toDataURL('image/png');
    a.click();
  });

  function exportDraw(ectx, W, H) {
    const gs = Math.max(10, state.gridSize);
    const cx = W/2, cy = H/2;

    ectx.fillStyle = state.bg;
    ectx.fillRect(0,0,W,H);

    ectx.strokeStyle = state.gridCol; ectx.lineWidth = 0.75;
    for (let x = cx%gs; x<=W; x+=gs) { ectx.beginPath(); ectx.moveTo(x,0); ectx.lineTo(x,H); ectx.stroke(); }
    for (let x = cx%gs-gs; x>=0; x-=gs) { ectx.beginPath(); ectx.moveTo(x,0); ectx.lineTo(x,H); ectx.stroke(); }
    for (let y = cy%gs; y<=H; y+=gs) { ectx.beginPath(); ectx.moveTo(0,y); ectx.lineTo(W,y); ectx.stroke(); }
    for (let y = cy%gs-gs; y>=0; y-=gs) { ectx.beginPath(); ectx.moveTo(0,y); ectx.lineTo(W,y); ectx.stroke(); }

    const labelFs = Math.max(9, Math.min(gs*0.28,16));
    ectx.font = `500 ${labelFs}px 'JetBrains Mono', monospace`;
    ectx.fillStyle = state.gridCol; ectx.globalAlpha = 0.7;
    const rowTop=['E','D','C','B','A'], rowBottom=['a','b','c','d','e'];
    let ci=1;
    for (let x=cx+gs;x<W;x+=gs,ci++){ectx.textAlign='center';ectx.textBaseline='top';ectx.fillText(ci,x,4);ectx.textBaseline='bottom';ectx.fillText(ci,x,H-4);}
    ci=1;
    for (let x=cx-gs;x>0;x-=gs,ci++){ectx.textAlign='center';ectx.textBaseline='top';ectx.fillText(-ci,x,4);ectx.textBaseline='bottom';ectx.fillText(-ci,x,H-4);}
    let ri=0;
    for (let y=cy-gs;y>0;y-=gs,ri++){const l=rowTop[Math.min(ri,4)];ectx.textAlign='left';ectx.textBaseline='middle';ectx.fillText(l,4,y);ectx.textAlign='right';ectx.fillText(l,W-4,y);}
    ri=0;
    for (let y=cy+gs;y<H;y+=gs,ri++){const l=rowBottom[Math.min(ri,4)];ectx.textAlign='left';ectx.textBaseline='middle';ectx.fillText(l,4,y);ectx.textAlign='right';ectx.fillText(l,W-4,y);}
    ectx.globalAlpha=1;

    ectx.strokeStyle=state.gridCol; ectx.lineWidth=1; ectx.globalAlpha=0.55;
    [[0,0],[W,0],[0,H],[W,H]].forEach(([px,py])=>{ectx.beginPath();ectx.moveTo(px,py);ectx.lineTo(cx,cy);ectx.stroke();});
    ectx.globalAlpha=1;

    ectx.strokeStyle=state.circleCol; ectx.lineWidth=1.5; ectx.globalAlpha=0.9;
    [cx,0,W].forEach(x=>{ectx.beginPath();ectx.arc(x,cy,H/2,0,Math.PI*2);ectx.stroke();});
    ectx.globalAlpha=1;

    if (state.cross) {
      ectx.strokeStyle=state.crossCol; ectx.lineWidth=1.5;
      ectx.beginPath(); ectx.moveTo(0,cy); ectx.lineTo(W,cy); ectx.moveTo(cx,0); ectx.lineTo(cx,H); ectx.stroke();
      ectx.fillStyle=state.crossCol; ectx.beginPath(); ectx.arc(cx,cy,4,0,Math.PI*2); ectx.fill();
      ectx.strokeStyle=state.crossCol; ectx.lineWidth=1; ectx.beginPath(); ectx.arc(cx,cy,14,0,Math.PI*2); ectx.stroke();
    }
    if (state.corners) {
      const mk=Math.min(gs*0.8,40);
      ectx.strokeStyle=state.crossCol; ectx.lineWidth=1.5;
      [[0,0],[W,0],[0,H],[W,H]].forEach(([px,py])=>{const dx=px===0?1:-1,dy=py===0?1:-1;ectx.beginPath();ectx.moveTo(px,py);ectx.lineTo(px+dx*mk,py);ectx.moveTo(px,py);ectx.lineTo(px,py+dy*mk);ectx.stroke();});
      const tick=Math.min(gs*0.5,24);
      [[cx,0,0,tick],[cx,H,0,-tick],[0,cy,tick,0],[W,cy,-tick,0]].forEach(([x,y,dx,dy])=>{ectx.beginPath();ectx.moveTo(x,y);ectx.lineTo(x+dx,y+dy);ectx.stroke();});
    }
    const fs=Math.max(12,Math.min(W,H)*0.028);
    ectx.font=`600 ${fs}px 'JetBrains Mono', monospace`;
    ectx.fillStyle='#fff'; ectx.globalAlpha=0.6;
    ectx.textAlign='center'; ectx.textBaseline='middle';
    ectx.fillText(`${W}px × ${H}px`, cx, cy-H*0.13);
    ectx.globalAlpha=1;

    if (state.showBorder) {
      const bw = Math.max(1, state.borderW);
      ectx.strokeStyle = state.borderCol;
      ectx.lineWidth = bw;
      ectx.strokeRect(bw/2, bw/2, W-bw, H-bw);
    }
  }

  // Fullscreen
  document.getElementById('fs-btn').addEventListener('click', () => {
    const wrap = document.getElementById('canvas-wrap');
    if (!document.fullscreenElement) wrap.requestFullscreen();
    else document.exitFullscreen();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') document.getElementById('fs-btn').click();
  });
  document.addEventListener('fullscreenchange', () => setTimeout(resize, 100));
</script>

    font-size: 1rem;
    padding: 8px 12px;

    border-left: none;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 8px 10px;
    outline: none;
    cursor: pointer;
    border-radius: 0 3px 3px 0;
    min-width: 54px;
  }

  select option { background: var(--surface); }

  .full-select {
    width: 100%;
    border-radius: 3px;
  }

  .radio-group {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .radio-group input { display: none; }

  .radio-group label {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    cursor: pointer;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    background: var(--surface);
    color: var(--muted);
    margin: 0;
    border-right: 1px solid var(--border);
    transition: all 0.15s;
  }

  .radio-group input:checked + label {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  .calc-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: var(--sans);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    border-radius: 3px;
    margin-top: 8px;
    transition: background 0.15s, transform 0.1s;
  }

  .calc-btn:hover { background: #cc1f1f; }
  .calc-btn:active { transform: scale(0.98); }

  .results {
    margin-top: 20px;
    display: none;
  }

  .results.show { display: block; }

  .result-hero {
    background: linear-gradient(135deg, #1a0a0a 0%, #131313 100%);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
  }

  .result-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(255,51,51,0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  .result-hero-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;

    font-size: 2.8rem;
    color: var(--accent);
    line-height: 1;
  }

  .result-hero-value span {
    font-size: 1.1rem;
    color: var(--muted);
    margin-left: 6px;
  }

  .result-hero-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 6px;
  }

  .result-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  @media (max-width: 560px) {
    .result-grid { grid-template-columns: 1fr 1fr; }
  }

  .result-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px;

  .result-card-label {

    font-weight: 600;

    text-transform: uppercase;

    font-size: 1.1rem;

  .brand-chip.panasonic.active { border-color: #4a9ae8; color: #4a9ae8; background: #101520; }
  .brand-chip.nec.active    { border-color: #4ae890; color: #4ae890; background: #101a14; }
  .brand-chip.epson.active  { border-color: #e8a44a; color: #e8a44a; background: #1a1508; }
  .brand-chip.christie.active { border-color: #b04ae8; color: #b04ae8; background: #160e1a; }

  .brand-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }

  .brand-section {
    margin-bottom: 16px;
  }

  .brand-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-radius: 4px 4px 0 0;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .brand-header.barco   { background: #1a1015; border: 1px solid #5a2040; color: #e84a6a; }
  .brand-header.panasonic { background: #101520; border: 1px solid #203050; color: #4a9ae8; }
  .brand-header.nec     { background: #101a14; border: 1px solid #205030; color: #4ae890; }
  .brand-header.epson   { background: #1a1508; border: 1px solid #503a10; color: #e8a44a; }
  .brand-header.christie { background: #160e1a; border: 1px solid #3a1050; color: #b04ae8; }

  .lens-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 0.78rem;
  }

  .lens-table th {
    background: var(--surface);
    color: var(--muted);
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    font-family: var(--sans);
    font-weight: 600;
  }

  .lens-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }

  .lens-table tr:last-child td { border-bottom: none; }

  .lens-table tr.match td { background: rgba(255,51,51,0.06); }
  .lens-table tr.best-match td { background: rgba(255,51,51,0.13); }

  .lens-table tr.match td:first-child,
  .lens-table tr.best-match td:first-child {

  .match-badge {
    display: inline-block;
    padding: 2px 6px;
    font-size: 0.6rem;
    font-family: var(--sans);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-radius: 2px;
    margin-left: 6px;
  }

  .match-badge.best { background: var(--accent); color: #fff; }
  .match-badge.ok   { background: var(--border); color: var(--muted); }

  .part-num { color: var(--muted); font-size: 0.72rem; }

  .brand-section-wrap {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 4px 4px;
    overflow: hidden;
  }

  .section-title {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin: 20px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

<script>
// Unit conversion utility
function toM(val, unit) {
  if (!val || isNaN(val)) return 0;
  switch(unit) {
    case 'm':  return val;
    case 'cm': return val / 100;
    case 'mm': return val / 1000;
    case 'ft': return val * 0.3048;
    case 'in': return val * 0.0254;
    default:   return val;
  }
}
</script>
<script>
// ─── Shared utility ───────────────────────────────────────────────────────────
// (toM defined in blend script above)

// Parse chip option value: &quot;prefix_diagInches_widthMM_WxH&quot; e.g. &quot;b_1.27_27.90_3840x2400&quot;
function parseChipValue(val) {
  if (val === 'custom') return null;
  const parts = val.split('_');
  const resPart = parts.find(p => /^\d+x\d+$/.test(p));
  let resW = 0, resH = 0;
  if (resPart) { [resW, resH] = resPart.split('x').map(Number); }
  return { diag: parseFloat(parts[1]), w: parseFloat(parts[2]), resW, resH };
}

function getChipRes() {
  const val = document.getElementById('chipSize').value;
  if (val === 'custom') {
    return {
      resW: parseInt(document.getElementById('customResW').value) || 1920,
      resH: parseInt(document.getElementById('customResH').value) || 1080
    };
  }
  const c = parseChipValue(val);
  return { resW: c.resW, resH: c.resH };
}

function onChipChange(sel) {
  const val = sel.value;
  const isCustom = val === 'custom';
  document.getElementById('customChipField').style.display = isCustom ? 'block' : 'none';
  const info = document.getElementById('chip-info-tag');
  if (isCustom) { info.textContent = ''; return; }
  const chip = parseChipValue(val);
  const resStr = chip.resW ? `  ·  native: ${chip.resW}×${chip.resH}` : '';
  info.textContent = `chip: ${chip.w} mm  |  diag: ${chip.diag}&quot;${resStr}`;
}

// Run once on load to set info tag for default selection
onChipChange(document.getElementById('chipSize'));

// Auto-fill W/H from diagonal
document.getElementById('screenDiag').addEventListener('input', fillFromDiag);
document.querySelectorAll('input[name=&quot;ar&quot;]').forEach(r => r.addEventListener('change', fillFromDiag));

function fillFromDiag() {
  const diagVal = parseFloat(document.getElementById('screenDiag').value);
  if (!diagVal || isNaN(diagVal)) return;
  const diagM = toM(diagVal, document.getElementById('screenDiagUnit').value);
  const arStr = document.querySelector('input[name=&quot;ar&quot;]:checked').value;
  const [aw, ah] = arStr.split(':').map(Number);
  const ratio = aw / ah;
  const h = diagM / Math.sqrt(ratio * ratio + 1);
  const w = h * ratio;
  document.getElementById('screenW').value = parseFloat(w.toFixed(2));
  document.getElementById('screenH').value = parseFloat(h.toFixed(2));
  document.getElementById('screenWUnit').value = 'm';
  document.getElementById('screenHUnit').value = 'm';
}

function calculate() {
  let sw = toM(parseFloat(document.getElementById('screenW').value), document.getElementById('screenWUnit').value);
  let sh = toM(parseFloat(document.getElementById('screenH').value), document.getElementById('screenHUnit').value);
  let td = toM(parseFloat(document.getElementById('throwDist').value), document.getElementById('throwDistUnit').value);

  if (!sw || !sh || !td || isNaN(sw) || isNaN(sh) || isNaN(td)) {
    alert('Please fill in screen width, height, and throw distance.');
    return;
  }

  const chipSel = document.getElementById('chipSize').value;
  let chipW_mm;
  if (chipSel === 'custom') {
    chipW_mm = parseFloat(document.getElementById('customChipW').value);
  } else {
    chipW_mm = parseChipValue(chipSel).w;
  }

  const throwRatio = td / sw;
  const diagM = Math.sqrt(sw*sw + sh*sh);
  const diagIn = diagM / 0.0254;

  // Focal length estimate: FL = throwRatio * chipWidth
  // This is the standard approximation used in projector optics
  const focalLength_mm = throwRatio * chipW_mm;

  // F-stop: typical projector lenses F/1.7 – F/2.8
  const fMin = (focalLength_mm / (chipW_mm * 0.85)).toFixed(1);
  const fMax = (focalLength_mm / (chipW_mm * 0.45)).toFixed(1);

  // Classify throw type
  let category, catColour;
  if (throwRatio < 0.4) { category = 'Ultra Short Throw (UST)'; catColour = '#e84a9a'; }
  else if (throwRatio < 0.8) { category = 'Short Throw'; catColour = '#4ae890'; }
  else if (throwRatio <= 2.0) { category = 'Standard Throw'; catColour = '#aaaaaa'; }
  else if (throwRatio <= 3.5) { category = 'Long Throw'; catColour = '#ff3333'; }
  else { category = 'Very Long Throw'; catColour = '#e87a4a'; }

  // Display results
  document.getElementById('res-tr').innerHTML = `${throwRatio.toFixed(2)}<span>: 1</span>`;
  document.getElementById('res-tr-desc').textContent = `${td.toFixed(2)} m throw ÷ ${sw.toFixed(2)} m width`;
  document.getElementById('res-dist').textContent = `${td.toFixed(2)} m`;
  document.getElementById('res-sw').textContent = `${sw.toFixed(2)} m`;
  document.getElementById('res-diag').textContent = `${diagIn.toFixed(0)}&quot; (${(diagM*100).toFixed(0)} cm)`;
  document.getElementById('res-fl').textContent = `${focalLength_mm.toFixed(1)} mm`;
  document.getElementById('res-fstop').textContent = `f/${fMin} – f/${fMax}`;
  const catEl = document.getElementById('res-cat');
  catEl.textContent = category;
  catEl.style.color = catColour;

  // Lens recommendations
  const recEl = document.getElementById('lens-recs');
  recEl.innerHTML = '';

  const recs = getLensRecs(throwRatio, focalLength_mm, chipSel);
  recs.forEach(r => {
    recEl.innerHTML += `
      <div class=&quot;lens-rec&quot;>
        <div class=&quot;lens-rec-title&quot;>${r.title}</div>
        <div class=&quot;lens-rec-detail&quot;>${r.detail}</div>
      </div>`;
  });

  // Warnings
  const warnEl = document.getElementById('warn-area');
  warnEl.innerHTML = '';
  if (throwRatio < 0.4) {
    warnEl.innerHTML += `<div class=&quot;warn&quot;>⚠ Ultra-short throw projectors require special UST lenses and precise ceiling/floor mounting. Standard lenses won't work at this distance.</div>`;
  }
  if (td < 0.5) {
    warnEl.innerHTML += `<div class=&quot;warn&quot;>⚠ Throw distance under 0.5 m — very few projectors support this. Consider a large display panel instead.</div>`;
  }
  if (throwRatio > 4.5) {
    warnEl.innerHTML += `<div class=&quot;warn&quot;>⚠ Very high throw ratio. Long-throw lenses can suffer from reduced brightness and keystone. Verify your projector has sufficient ANSI lumens.</div>`;
  }

  drawDiagram(td, sw, sh);
  renderBrandTables(throwRatio);

  document.getElementById('results').className = 'results show';
}

function getLensRecs(tr, fl_mm, chipSel) {
  const recs = [];

  if (tr < 0.4) {
    recs.push({
      title: 'UST Fixed Lens',
      detail: `Throw ratio ${tr.toFixed(2)}:1 requires an ultra-short throw fixed lens. Look for UST lenses rated 0.2–0.4:1. Examples: Optoma UST, BenQ UST series, Sony VPL-VZ7. These use mirror-assisted or fisheye-type optics and are usually non-interchangeable.`
    });
  } else if (tr < 0.8) {
    recs.push({
      title: 'Short Throw Zoom Lens',
      detail: `Estimated focal length ~${fl_mm.toFixed(0)} mm. Short throw zoom lenses in the 0.75–0.8:1 range. Suitable for classrooms or small boardrooms. Look for lenses rated 0.6–0.8:1 throw ratio. EIKI, Barco, Christie, and Panasonic all make ET-short-throw adapters for their platforms.`
    });
  } else if (tr <= 2.0) {
    recs.push({
      title: 'Standard Zoom Lens (Primary Recommendation)',
      detail: `Estimated focal length ~${fl_mm.toFixed(0)} mm. This is the most common projector lens range. Most projectors ship with a 1.2:1–2.0:1 standard zoom. Verify your throw ratio falls within your projector's native zoom range — if it does, no additional lens is needed.`
    });
    recs.push({
      title: 'Interchangeable Zoom Lens',
      detail: `If using a large-venue projector (Barco, Christie, NEC PA series, Panasonic PT-RZ), select a zoom lens covering your throw ratio of ${tr.toFixed(2)}:1. Most manufacturers label lenses by their TR range, e.g. &quot;1.25–1.79:1 zoom lens&quot;.`
    });
  } else if (tr <= 3.5) {
    recs.push({
      title: 'Long Throw Zoom Lens',
      detail: `Estimated focal length ~${fl_mm.toFixed(0)} mm. Throw ratio ${tr.toFixed(2)}:1 falls in the long-throw range. Look for lenses rated 2.0–3.5:1. These are common for rear-projection or large venues with long throws. NEC, Epson, and Barco offer long-throw options for their respective mounts.`
    });
  } else {
    recs.push({
      title: 'Very Long Throw / Tele Lens',
      detail: `Estimated focal length ~${fl_mm.toFixed(0)} mm. Throw ratio ${tr.toFixed(2)}:1 requires a telephoto lens. These are typically found in specialised large-venue projectors (Christie, Barco, Panasonic ET-ELT). Expect reduced flux (brightness) with very long throw lenses — account for this in your lumen budget.`
    });
  }

  const chipLabel = chipSel === 'custom' ? 'custom'
    : (() => { const c = parseChipValue(chipSel); return `${c.diag}&quot;`; })();
  recs.push({
    title: 'Verification Tip',
    detail: `Always cross-check with your projector manufacturer's official throw distance calculator. Each projector model has a specific throw ratio range for each lens. The estimated focal length of ~${fl_mm.toFixed(0)} mm is derived from throw ratio × chip width (${chipLabel} chip).`
  });

  return recs;
}

function renderBrandTables(throwRatio) {
  const activeBrands = ['barco','panasonic','nec','epson','christie'].filter(b =>
    document.getElementById('brand-' + b).checked
  );

  const container = document.getElementById('brand-lens-tables');
  const section = document.getElementById('brand-lens-section');
  container.innerHTML = '';

  if (activeBrands.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';

  activeBrands.forEach(brand => {
    const db = LENS_DB[brand];
    // Find best match (lens with TR range containing the throw ratio)
    // Score: exact fit = 2, within 10% = 1, no fit = 0
    const scored = db.lenses.map(l => {
      let score = 0;
      const isFixed = l.tr_min === l.tr_max;
      if (isFixed) {
        const diff = Math.abs(throwRatio - l.tr_min) / l.tr_min;
        if (diff < 0.05) score = 2;
        else if (diff < 0.15) score = 1;
      } else {
        if (throwRatio >= l.tr_min &amp;&amp; throwRatio <= l.tr_max) score = 2;
        else if (throwRatio >= l.tr_min * 0.9 &amp;&amp; throwRatio <= l.tr_max * 1.1) score = 1;
      }
      return { ...l, score };
    });

    const maxScore = Math.max(...scored.map(l => l.score));

    let rows = scored.map(l => {
      const isBest = l.score === 2 &amp;&amp; maxScore === 2;
      const isOk   = l.score === 1 &amp;&amp; maxScore < 2;
      const rowClass = isBest ? 'best-match' : (l.score >= 1 ? 'match' : '');
      const badge = isBest ? `<span class=&quot;match-badge best&quot;>✓ Match</span>`
                  : (isOk  ? `<span class=&quot;match-badge ok&quot;>Near</span>` : '');
      const trRange = l.tr_min === l.tr_max
        ? `${l.tr_min.toFixed(2)}:1 (fixed)`
        : `${l.tr_min.toFixed(2)} – ${l.tr_max.toFixed(2)} : 1`;
      return `
        <tr class=&quot;${rowClass}&quot;>
          <td>${l.name}${badge}</td>
          <td class=&quot;part-num&quot;>${l.part}</td>
          <td>${trRange}</td>
          <td>${l.fl}</td>
          <td style=&quot;color:var(--muted)&quot;>${l.type}</td>
        </tr>`;
    }).join('');

    container.innerHTML += `
      <div class=&quot;brand-section&quot;>
        <div class=&quot;brand-header ${brand}&quot;>
          <span style=&quot;width:8px;height:8px;border-radius:50%;background:${db.color};display:inline-block&quot;></span>
          ${db.name} — Interchangeable Lens Catalogue
        </div>
        <div class=&quot;brand-section-wrap&quot;>
          <table class=&quot;lens-table&quot;>
            <thead>
              <tr>
                <th>Lens Name</th>
                <th>Part #</th>
                <th>Throw Ratio Range</th>
                <th>Focal Length</th>
                <th>Type</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div style=&quot;font-size:0.74rem;color:var(--muted);padding:8px 2px;&quot;>${db.note}</div>
      </div>`;
  });
}

function drawDiagram(td, sw, sh) {
  const svg = document.getElementById('diagram');
  const W = 600, H = 140;
  const PAD = 30;
  const projX = PAD + 30;
  const screenX = W - PAD - 10;
  const midY = H / 2;
  const screenHPx = Math.min(sh / sw * 80, 90);
  const projY = midY;

  svg.innerHTML = `
    <!-- beam trapezoid -->
    <polygon points=&quot;${projX},${midY} ${screenX},${midY - screenHPx/2} ${screenX},${midY + screenHPx/2}&quot; 
      fill=&quot;rgba(255,51,51,0.05)&quot; stroke=&quot;rgba(255,51,51,0.3)&quot; stroke-width=&quot;1&quot; stroke-dasharray=&quot;4 3&quot;/>
    
    <!-- top/bottom beam lines -->
    <line x1=&quot;${projX}&quot; y1=&quot;${midY}&quot; x2=&quot;${screenX}&quot; y2=&quot;${midY - screenHPx/2}&quot;
      stroke=&quot;rgba(180,180,180,0.4)&quot; stroke-width=&quot;1&quot;/>
    <line x1=&quot;${projX}&quot; y1=&quot;${midY}&quot; x2=&quot;${screenX}&quot; y2=&quot;${midY + screenHPx/2}&quot;
      stroke=&quot;rgba(180,180,180,0.4)&quot; stroke-width=&quot;1&quot;/>
    
    <!-- screen -->
    <rect x=&quot;${screenX}&quot; y=&quot;${midY - screenHPx/2}&quot; width=&quot;8&quot; height=&quot;${screenHPx}&quot;
      fill=&quot;#1a1e28&quot; stroke=&quot;#aaaaaa&quot; stroke-width=&quot;1.5&quot; rx=&quot;1&quot;/>
    
    <!-- projector body -->
    <rect x=&quot;${projX - 30}&quot; y=&quot;${midY - 14}&quot; width=&quot;32&quot; height=&quot;28&quot; rx=&quot;3&quot;
      fill=&quot;#1a1e28&quot; stroke=&quot;#ff3333&quot; stroke-width=&quot;1.5&quot;/>
    <circle cx=&quot;${projX}&quot; cy=&quot;${midY}&quot; r=&quot;5&quot; fill=&quot;none&quot; stroke=&quot;#ff3333&quot; stroke-width=&quot;1.5&quot;/>
    <circle cx=&quot;${projX}&quot; cy=&quot;${midY}&quot; r=&quot;2&quot; fill=&quot;#ff3333&quot; opacity=&quot;0.7&quot;/>
    
    <!-- throw distance arrow -->
    <line x1=&quot;${projX}&quot; y1=&quot;${H - 16}&quot; x2=&quot;${screenX}&quot; y2=&quot;${H - 16}&quot;
      stroke=&quot;${'#5a6478'}&quot; stroke-width=&quot;1&quot;/>
    <polygon points=&quot;${projX},${H-16} ${projX+7},${H-19} ${projX+7},${H-13}&quot; fill=&quot;#5a6478&quot;/>
    <polygon points=&quot;${screenX},${H-16} ${screenX-7},${H-19} ${screenX-7},${H-13}&quot; fill=&quot;#5a6478&quot;/>
    <text x=&quot;${(projX + screenX)/2}&quot; y=&quot;${H - 6}&quot; text-anchor=&quot;middle&quot;
      font-family=&quot;'Share Tech Mono',monospace&quot; font-size=&quot;10&quot; fill=&quot;#5a6478&quot;>
      throw: ${td.toFixed(2)} m
    </text>
    
    <!-- screen width label -->
    <line x1=&quot;${screenX + 14}&quot; y1=&quot;${midY - screenHPx/2}&quot; x2=&quot;${screenX + 14}&quot; y2=&quot;${midY + screenHPx/2}&quot;
      stroke=&quot;#5a6478&quot; stroke-width=&quot;1&quot;/>
    <text x=&quot;${screenX + 22}&quot; y=&quot;${midY + 4}&quot; font-family=&quot;'Share Tech Mono',monospace&quot; font-size=&quot;9&quot; fill=&quot;#5a6478&quot;>
      ${sw.toFixed(2)}m
    </text>
  `;
}

<script>
// ── BORDER ─────────────────────────────────────────────────────────
function getBorderConfig() {
  return {
    enabled:  document.getElementById('border-enabled').checked,
    width:    parseInt(document.getElementById('border-width').value)  || 20,
    color:    document.getElementById('border-color').value,
    style:    document.getElementById('border-style').value,
    position: document.getElementById('border-position').value,
  };
}

function onBorderChange() {
  const enabled = document.getElementById('border-enabled').checked;
  document.getElementById('border-controls').classList.toggle('open', enabled);
  syncBorderColor();
  applyBorderToCanvas();
}

function syncBorderColor() {
  document.getElementById('border-hex').value = document.getElementById('border-color').value;
}
function syncBorderHex() {
  const v = document.getElementById('border-hex').value;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('border-color').value = v;
}

function applyBorderToCanvas() {
  const overlay = document.getElementById('slide-border-overlay');
  const cfg = getBorderConfig();
  if (!cfg.enabled) {
    overlay.classList.remove('visible');
    overlay.style.cssText = '';
    return;
  }
  overlay.classList.add('visible');

  // We use an absolutely-positioned inset div so html2canvas captures it.
  // For 'inset' position: border draws inside the slide bounds (no overflow).
  // For 'center': border straddles the edge — we clip overflow on the canvas.
  const half = Math.round(cfg.width / 2);
  if (cfg.position === 'inset') {
    overlay.style.cssText = `
      position:absolute; z-index:3; pointer-events:none; display:block;
      top:0; left:0; right:0; bottom:0;
      border: ${cfg.width}px ${cfg.style} ${cfg.color};
      box-sizing: border-box;
    `;
  } else {
    // center — inset by half so the border straddles the edge; canvas overflow:hidden clips the outer half
    overlay.style.cssText = `
      position:absolute; z-index:3; pointer-events:none; display:block;
      top:${-half}px; left:${-half}px; right:${-half}px; bottom:${-half}px;
      border: ${cfg.width}px ${cfg.style} ${cfg.color};
      box-sizing: border-box;
    `;
  }
}

// ── RESISTOR COLOUR CODE ────────────────────────────────────────────
// digit 0–9 → { name, bg, text }
const RESISTOR = [
  { name: 'Black',  bg: '#000000', text: '#ffffff' },
  { name: 'Brown',  bg: '#8B4500', text: '#ffffff' },
  { name: 'Red',    bg: '#cc0000', text: '#ffffff' },
  { name: 'Orange', bg: '#ff6600', text: '#ffffff' },
  { name: 'Yellow', bg: '#ffff00', text: '#000000' },
  { name: 'Green',  bg: '#009900', text: '#ffffff' },
  { name: 'Blue',   bg: '#0000cc', text: '#ffffff' },
  { name: 'Violet', bg: '#8b008b', text: '#ffffff' },
  { name: 'Grey',   bg: '#888888', text: '#ffffff' },
  { name: 'White',  bg: '#ffffff', text: '#000000' },
];

// ── STATE ──────────────────────────────────────────────────────────
let slides      = [];       // array of strings (text)
let slideColors = [];       // array of { bg, text } | null  (per-slide override)
let slideSlashes = [];      // array of { enabled, corner, size, color } | null
let currentIndex = 0;
let slideW = 1920, slideH = 1080;
const PPI = 96, PPCM = PPI / 2.54;

let palettes = [
  { name: 'Brown',  bg: '#8B4500', text: '#ffffff' },
  { name: 'Purple', bg: '#7B2D8B', text: '#ffffff' },
  { name: 'Navy',   bg: '#0D2167', text: '#ffffff' },
  { name: 'Sky',    bg: '#00AEEF', text: '#ffffff' },
  { name: 'Green',  bg: '#8DC63F', text: '#ffffff' },
  { name: 'Yellow', bg: '#ffff00', text: '#000000' },
  { name: 'Orange', bg: '#F7941D', text: '#ffffff' },
  { name: 'Red',    bg: '#ff0000', text: '#ffffff' },
];

// ── HELPERS ────────────────────────────────────────────────────────
function getSlideColor(i) {
  // Returns effective { bg, text } for slide i
  if (slideColors[i]) return slideColors[i];
  return {
    bg:   document.getElementById('bg-color').value,
    text: document.getElementById('text-color').value,
  };
}

// ── GENERATE ───────────────────────────────────────────────────────
function generateSlides() {
  const lines = document.getElementById('text-input').value
    .split('\n').map(l => l.trim()).filter(l => l.length);
  if (!lines.length) { alert('Enter at least one line.'); return; }

  // Preserve existing per-slide overrides where possible
  const oldColors   = slideColors.slice();
  const oldSlashes  = slideSlashes.slice();
  slides       = lines;
  slideColors  = lines.map((_, i) => oldColors[i]  || null);
  slideSlashes = lines.map((_, i) => oldSlashes[i] || null);
  currentIndex = 0;
  renderSlideList();
  updatePreview();
}

function clearAll() {
  slides = []; slideColors = []; slideSlashes = []; currentIndex = 0;
  document.getElementById('text-input').value = '';
  document.getElementById('slide-list').innerHTML = '';
  closeEditor();
  updatePreview();
}

// ── RESISTOR AUTO-ASSIGN ───────────────────────────────────────────
function applyResistorAll() {
  if (!slides.length) { alert('Generate slides first.'); return; }
  slides.forEach((_, i) => {
    const digit = i % 10; // cycle through 0–9
    slideColors[i] = { bg: RESISTOR[digit].bg, text: RESISTOR[digit].text };
  });
  renderSlideList();
  updatePreview();
  // Flash the button
  const btn = document.getElementById('resistor-all-btn');
  btn.classList.add('resistor-active');
  setTimeout(() => btn.classList.remove('resistor-active'), 1200);
}

// ── SLIDE LIST ─────────────────────────────────────────────────────
function renderSlideList() {
  const list = document.getElementById('slide-list');
  list.innerHTML = '';
  slides.forEach((text, i) => {
    const col = getSlideColor(i);
    const hasOverride = !!slideColors[i];
    const hasSlash    = !!(slideSlashes[i] &amp;&amp; slideSlashes[i].enabled);

    const el = document.createElement('div');
    el.className = 'slide-thumb' + (i === currentIndex ? ' active' : '');
    el.innerHTML = `
      <div class=&quot;slide-color-bar&quot; style=&quot;background:${col.bg};&quot;></div>
      <div class=&quot;slide-thumb-inner&quot;>
        <span class=&quot;slide-num&quot;>${String(i+1).padStart(2,'0')}</span>
        <span class=&quot;slide-label&quot;>${text}</span>
        ${hasSlash ? `<span style=&quot;font-size:10px;opacity:0.7;&quot; title=&quot;Has corner slash&quot;>◤</span>` : ''}
        <span class=&quot;slide-color-dot&quot; style=&quot;background:${col.bg};${hasOverride ? 'outline:2px solid var(--accent);outline-offset:1px;' : ''}&quot; title=&quot;${hasOverride ? 'Custom colour' : 'Default colour'}&quot;></span>
      </div>`;
    el.onclick = () => { currentIndex = i; renderSlideList(); updatePreview(); openEditor(i); };
    list.appendChild(el);
  });
}

// ── PER-SLIDE EDITOR ───────────────────────────────────────────────
function openEditor(i) {
  const editor = document.getElementById('slide-color-editor');
  editor.classList.add('open');

  document.getElementById('editor-slide-label').textContent = `Slide ${i+1} colours`;

  const col = getSlideColor(i);
  document.getElementById('slide-bg-color').value   = col.bg;
  document.getElementById('slide-bg-hex').value     = col.bg;
  document.getElementById('slide-text-color').value = col.text;
  document.getElementById('slide-text-hex').value   = col.text;

  // Resistor bar
  renderResistorBar(i);

  // Slash state
  const slash = slideSlashes[i];
  const slashEnabled = !!(slash &amp;&amp; slash.enabled);
  document.getElementById('slash-enabled').checked = slashEnabled;
  document.getElementById('slash-controls').style.display = slashEnabled ? 'block' : 'none';
  if (slash) {
    setActiveCornerBtn(slash.corner || 'tl');
    document.getElementById('slash-size').value  = slash.size  || 300;
    document.getElementById('slash-color').value = slash.color || '#000000';
    document.getElementById('slash-hex').value   = slash.color || '#000000';
  } else {
    setActiveCornerBtn('tl');
    document.getElementById('slash-size').value  = 300;
    document.getElementById('slash-color').value = '#000000';
    document.getElementById('slash-hex').value   = '#000000';
  }
}

function closeEditor() {
  document.getElementById('slide-color-editor').classList.remove('open');
}

function renderResistorBar(slideIdx) {
  const bar = document.getElementById('resistor-bar');
  const digit = slideIdx % 10;
  document.getElementById('resistor-digit-label').textContent =
    `Slide #${slideIdx+1} → band ${digit} (${RESISTOR[digit].name})`;

  bar.innerHTML = '';
  RESISTOR.forEach((r, d) => {
    const band = document.createElement('div');
    band.className = 'resistor-band' + (d === digit ? ' active-band' : '');
    band.style.background = r.bg;
    band.style.color = r.text;
    band.title = `${d}: ${r.name}`;
    band.textContent = d;
    band.onclick = () => applyResistorBand(slideIdx, d);
    bar.appendChild(band);
  });
}

function applyResistorBand(slideIdx, digit) {
  const r = RESISTOR[digit];
  slideColors[slideIdx] = { bg: r.bg, text: r.text };
  // Update editor pickers
  document.getElementById('slide-bg-color').value   = r.bg;
  document.getElementById('slide-bg-hex').value     = r.bg;
  document.getElementById('slide-text-color').value = r.text;
  document.getElementById('slide-text-hex').value   = r.text;
  renderResistorBar(slideIdx);
  renderSlideList();
  updatePreview();
}

function syncSlideColor(type) {
  const v = document.getElementById(type === 'bg' ? 'slide-bg-color' : 'slide-text-color').value;
  document.getElementById(type === 'bg' ? 'slide-bg-hex' : 'slide-text-hex').value = v;
}
function syncSlideHex(type) {
  const v = document.getElementById(type === 'bg' ? 'slide-bg-hex' : 'slide-text-hex').value;
  if (/^#[0-9a-fA-F]{6}$/.test(v))
    document.getElementById(type === 'bg' ? 'slide-bg-color' : 'slide-text-color').value = v;
}
function applySlideColor() {
  const bg   = document.getElementById('slide-bg-color').value;
  const text = document.getElementById('slide-text-color').value;
  slideColors[currentIndex] = { bg, text };
  renderSlideList();
  updatePreview();
}
function clearSlideColor() {
  slideColors[currentIndex] = null;
  const col = getSlideColor(currentIndex);
  document.getElementById('slide-bg-color').value   = col.bg;
  document.getElementById('slide-bg-hex').value     = col.bg;
  document.getElementById('slide-text-color').value = col.text;
  document.getElementById('slide-text-hex').value   = col.text;
  renderSlideList();
  updatePreview();
}
function applyPaletteToSlide() {
  const bg   = document.getElementById('bg-color').value;
  const text = document.getElementById('text-color').value;
  slideColors[currentIndex] = { bg, text };
  document.getElementById('slide-bg-color').value   = bg;
  document.getElementById('slide-bg-hex').value     = bg;
  document.getElementById('slide-text-color').value = text;
  document.getElementById('slide-text-hex').value   = text;
  renderSlideList();
  updatePreview();
}

// ── CORNER SLASH ───────────────────────────────────────────────────
function getSlashConfig(i) {
  return slideSlashes[i] || { enabled: false, corner: 'tl', size: 300, color: '#000000' };
}

function onSlashChange() {
  const enabled = document.getElementById('slash-enabled').checked;
  document.getElementById('slash-controls').style.display = enabled ? 'block' : 'none';
  const corner = getActiveCorner();
  const size   = parseInt(document.getElementById('slash-size').value) || 300;
  const color  = document.getElementById('slash-color').value;
  slideSlashes[currentIndex] = { enabled, corner, size, color };
  renderSlideList();
  applySlashToCanvas(currentIndex);
}

function setCorner(corner, btn) {
  setActiveCornerBtn(corner);
  onSlashChange();
}

function setActiveCornerBtn(corner) {
  ['tl','tr','bl','br'].forEach(c => {
    document.getElementById('corner-' + c).classList.toggle('active', c === corner);
  });
}

function getActiveCorner() {
  for (const c of ['tl','tr','bl','br']) {
    if (document.getElementById('corner-' + c).classList.contains('active')) return c;
  }
  return 'tl';
}

function syncSlashColor() {
  document.getElementById('slash-hex').value = document.getElementById('slash-color').value;
}
function syncSlashHex() {
  const v = document.getElementById('slash-hex').value;
  if (/^#[0-9a-fA-F]{6}$/.test(v)) document.getElementById('slash-color').value = v;
}

function clearSlash() {
  slideSlashes[currentIndex] = { enabled: false, corner: 'tl', size: 300, color: '#000000' };
  document.getElementById('slash-enabled').checked = false;
  document.getElementById('slash-controls').style.display = 'none';
  setActiveCornerBtn('tl');
  document.getElementById('slash-size').value  = 300;
  document.getElementById('slash-color').value = '#000000';
  document.getElementById('slash-hex').value   = '#000000';
  renderSlideList();
  applySlashToCanvas(currentIndex);
}

// Renders the SVG slash triangle onto the live canvas for slide `idx`
function applySlashToCanvas(idx) {
  const svg  = document.getElementById('slide-slash-svg');
  const poly = document.getElementById('slash-polygon');
  const cfg  = getSlashConfig(idx);

  if (!cfg.enabled) {
    svg.classList.remove('visible');
    return;
  }

  svg.classList.add('visible');
  poly.setAttribute('fill', cfg.color);

  // Build triangle points based on corner &amp; size (in slide-pixel coords)
  const s = cfg.size;
  const W = slideW, H = slideH;
  let pts;
  switch (cfg.corner) {
    case 'tl': pts = `0,0 ${s},0 0,${s}`;           break;
    case 'tr': pts = `${W},0 ${W-s},0 ${W},${s}`;   break;
    case 'bl': pts = `0,${H} ${s},${H} 0,${H-s}`;   break;
    case 'br': pts = `${W},${H} ${W-s},${H} ${W},${H-s}`; break;
    default:   pts = `0,0 ${s},0 0,${s}`;
  }
  poly.setAttribute('points', pts);

  // SVG viewBox must match slide dimensions so it scales with the canvas
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
}

// ── PREVIEW ────────────────────────────────────────────────────────
function updatePreview() {
  const canvas  = document.getElementById('slide-canvas');
  const textEl  = document.getElementById('slide-text');
  const counter = document.getElementById('slide-counter');
  const wrapper = document.getElementById('preview-wrapper');
  const empty   = document.getElementById('empty-state');

  if (!slides.length) {
    wrapper.style.display = 'none'; empty.style.display = 'block';
    counter.textContent = 'No slides'; return;
  }

  wrapper.style.display = 'block'; empty.style.display = 'none';

  const col = getSlideColor(currentIndex);
  const fs  = document.getElementById('font-size').value;
  const fw  = document.getElementById('font-weight').value;
  const ff  = document.getElementById('font-family').value;

  canvas.style.width      = slideW + 'px';
  canvas.style.height     = slideH + 'px';
  canvas.style.background = col.bg;
  textEl.style.color      = col.text;
  textEl.style.fontSize   = fs + 'px';
  textEl.style.fontWeight = fw;
  textEl.style.fontFamily = ff;
  textEl.textContent      = slides[currentIndex] || '';

  counter.textContent = `Slide ${currentIndex + 1} of ${slides.length}`;
  scaleCanvas();
  applyBorderToCanvas();
  applySlashToCanvas(currentIndex);
}

function scaleCanvas() {
  const area  = document.getElementById('preview-area');
  const wrap  = document.getElementById('scale-wrap');
  const pwrap = document.getElementById('preview-wrapper');
  const scale = Math.min((area.clientWidth-56)/slideW, (area.clientHeight-56)/slideH, 1);
  wrap.style.transform = `scale(${scale})`;
  wrap.style.width     = slideW + 'px';
  wrap.style.height    = slideH + 'px';
  pwrap.style.width    = (slideW * scale) + 'px';
  pwrap.style.height   = (slideH * scale) + 'px';
}
window.addEventListener('resize', scaleCanvas);

// ── SIZE ───────────────────────────────────────────────────────────
function onSizeChange() {
  const unit = document.getElementById('size-unit').value;
  let w = parseFloat(document.getElementById('slide-w').value) || 1920;
  let h = parseFloat(document.getElementById('slide-h').value) || 1080;
  if (unit === 'in') { w *= PPI;  h *= PPI; }
  if (unit === 'cm') { w *= PPCM; h *= PPCM; }
  slideW = Math.max(100, Math.min(Math.round(w), 7680));
  slideH = Math.max(100, Math.min(Math.round(h), 4320));
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  updateSizeBadge(); updatePreview();
}
function onUnitChange() {
  const unit = document.getElementById('size-unit').value;
  const wEl = document.getElementById('slide-w'), hEl = document.getElementById('slide-h');
  if (unit === 'px')  { wEl.value = slideW; hEl.value = slideH; wEl.step = hEl.step = 1; }
  if (unit === 'in')  { wEl.value = (slideW/PPI).toFixed(2); hEl.value = (slideH/PPI).toFixed(2); wEl.step = hEl.step = 0.01; }
  if (unit === 'cm')  { wEl.value = (slideW/PPCM).toFixed(2); hEl.value = (slideH/PPCM).toFixed(2); wEl.step = hEl.step = 0.01; }
}
function applyPreset(w, h, btn) {
  slideW = w; slideH = h;
  document.getElementById('size-unit').value = 'px';
  document.getElementById('slide-w').value = w; document.getElementById('slide-w').step = 1;
  document.getElementById('slide-h').value = h; document.getElementById('slide-h').step = 1;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  updateSizeBadge(); updatePreview();
}
function updateSizeBadge() {
  document.getElementById('size-badge').textContent = `${slideW} × ${slideH}`;
}

// ── PALETTES ───────────────────────────────────────────────────────
function renderPalettes() {
  const grid = document.getElementById('palettes-grid');
  grid.innerHTML = '';
  palettes.forEach((p, i) => {
    const wrap   = document.createElement('div'); wrap.className = 'swatch-wrap';
    const swatch = document.createElement('div'); swatch.className = 'palette-swatch'; swatch.title = p.name;
    swatch.innerHTML = `
      <div class=&quot;swatch-top&quot; style=&quot;background:${p.bg};&quot;></div>
      <div class=&quot;swatch-bot&quot; style=&quot;background:${p.bg};color:${p.text};font-family:'JetBrains Mono',monospace;&quot;>Aa</div>
      <button class=&quot;swatch-del&quot; onclick=&quot;deletePalette(${i},event)&quot;>✕</button>`;
    swatch.onclick = () => applyPalette(i);
    const lbl = document.createElement('div'); lbl.className = 'palette-name'; lbl.textContent = p.name;
    wrap.appendChild(swatch); wrap.appendChild(lbl); grid.appendChild(wrap);
  });
}
function applyPalette(i) {
  const p = palettes[i];
  document.getElementById('bg-color').value   = p.bg;
  document.getElementById('bg-hex').value     = p.bg;
  document.getElementById('text-color').value = p.text;
  document.getElementById('text-hex').value   = p.text;
  renderSlideList(); updatePreview();
}
function savePalette() {
  const el = document.getElementById('palette-name');
  const name = el.value.trim() || 'Palette ' + (palettes.length + 1);
  palettes.push({ name, bg: document.getElementById('bg-color').value, text: document.getElementById('text-color').value });
  el.value = '';
  renderPalettes(); persist();
}
function deletePalette(i, e) { e.stopPropagation(); palettes.splice(i,1); renderPalettes(); persist(); }
function persist() { try { localStorage.setItem('slideExporterPalettes', JSON.stringify(palettes)); } catch(e) {} }
function loadFromStorage() { try { const s = localStorage.getItem('slideExporterPalettes'); if (s) palettes = JSON.parse(s); } catch(e) {} }

// ── GLOBAL COLOUR SYNC ─────────────────────────────────────────────
function syncColor(type) {
  document.getElementById(type==='bg'?'bg-hex':'text-hex').value =
    document.getElementById(type==='bg'?'bg-color':'text-color').value;
}
function syncHex(type) {
  const v = document.getElementById(type==='bg'?'bg-hex':'text-hex').value;
  if (/^#[0-9a-fA-F]{6}$/.test(v))
    document.getElementById(type==='bg'?'bg-color':'text-color').value = v;
}

// ── NAV ────────────────────────────────────────────────────────────
function navigate(dir) {
  if (!slides.length) return;
  currentIndex = (currentIndex + dir + slides.length) % slides.length;
  renderSlideList(); updatePreview(); openEditor(currentIndex);
}

// ── EXPORT ─────────────────────────────────────────────────────────
async function captureSlide(index) {
  const canvas  = document.getElementById('slide-canvas');
  const textEl  = document.getElementById('slide-text');
  const scaleEl = document.getElementById('scale-wrap');

  const col = getSlideColor(index);
  const fs  = document.getElementById('font-size').value;
  const fw  = document.getElementById('font-weight').value;
  const ff  = document.getElementById('font-family').value;

  canvas.style.width      = slideW + 'px';
  canvas.style.height     = slideH + 'px';
  canvas.style.background = col.bg;
  textEl.style.color      = col.text;
  textEl.style.fontSize   = fs + 'px';
  textEl.style.fontWeight = fw;
  textEl.style.fontFamily = ff;
  textEl.textContent      = slides[index];

  // Apply border and slash overlays for export
  applyBorderToCanvas();
  applySlashToCanvas(index);

  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 150));

  const old = scaleEl.style.transform;
  scaleEl.style.transform = 'scale(1)';

  const result = await html2canvas(canvas, {
    width: slideW, height: slideH, scale: 1,
    useCORS: true, allowTaint: true, backgroundColor: col.bg, logging: false,
  });

  scaleEl.style.transform = old;
  return result; // returns HTMLCanvasElement
}

// Convert canvas to Blob (Promise)
function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

// Reliable single-file download via Blob URL
function dlBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a   = document.createElement('a');
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

async function exportCurrent() {
  if (!slides.length) { alert('Generate slides first.'); return; }
  setProgress(true, 'Rendering slide…', 0);
  try {
    const rendered  = await captureSlide(currentIndex);
    const blob      = await canvasToBlob(rendered);
    const filename  = `slide_${pad(currentIndex+1)}_${safe(slides[currentIndex])}.png`;
    dlBlob(blob, filename);
    setProgress(true, '✓ Downloaded!', 100);
  } catch(e) {
    setProgress(true, '✗ Export failed: ' + e.message, 0);
  }
  setTimeout(() => { setProgress(false); updatePreview(); }, 2500);
}

async function exportAll() {
  if (!slides.length) { alert('Generate slides first.'); return; }

  setProgress(true, 'Building ZIP…', 0);

  const zip = new JSZip();
  const folder = zip.folder('slides');

  try {
    for (let i = 0; i < slides.length; i++) {
      setProgress(true, `Rendering slide ${i+1} of ${slides.length}…`, Math.round((i / slides.length) * 85));
      const rendered = await captureSlide(i);
      const blob     = await canvasToBlob(rendered);
      const filename = `slide_${pad(i+1)}_${safe(slides[i])}.png`;
      folder.file(filename, blob);
      await new Promise(r => setTimeout(r, 80)); // breathe between renders
    }

    setProgress(true, 'Compressing ZIP…', 88);
    const zipBlob = await zip.generateAsync(
      { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 3 } },
      meta => setProgress(true, `Compressing… ${meta.percent.toFixed(0)}%`, 88 + Math.round(meta.percent * 0.12))
    );

    const zipName = `slides_${slides.length}_export.zip`;
    dlBlob(zipBlob, zipName);
    setProgress(true, `✓ Downloaded ${slides.length} slide${slides.length > 1 ? 's' : ''} as ${zipName}`, 100);

  } catch(e) {
    setProgress(true, '✗ Export failed: ' + e.message, 0);
    console.error(e);
  }

  setTimeout(() => { setProgress(false); updatePreview(); }, 3500);
}

function setProgress(visible, message, pct) {
  const prog   = document.getElementById('export-progress');
  const fill   = document.getElementById('progress-fill');
  const status = document.getElementById('export-status');
  prog.classList.toggle('visible', visible);
  if (message !== undefined) status.textContent = message;
  if (pct     !== undefined) fill.style.width   = pct + '%';
}

function pad(n)  { return String(n).padStart(2, '0'); }
function safe(s) { return s.replace(/[^a-z0-9]/gi, '_').substring(0, 40); }

// ── INIT ───────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  loadFromStorage();
  renderPalettes();
  updateSizeBadge();
  scaleCanvas();
  updatePreview();
});
</script>
